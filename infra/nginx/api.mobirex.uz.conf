# API backend: api.mobirex.uz
# Django web container (mobirex_network ichida "web") ga proxy

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.mobirex.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.mobirex.uz$request_uri;
    }
}

# HTTPS backend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mobirex.uz;

    ssl_certificate     /etc/letsencrypt/live/api.mobirex.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mobirex.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    # Django collectstatic chiqaradigan fayllar (STATIC_ROOT=/app/staticfiles)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API va admin (Django) proxy
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
