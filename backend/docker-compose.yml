services:
  db:
    image: postgres:15
    container_name: mobirex_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-crm_db}
      POSTGRES_USER: ${DB_USER:-crm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mobirex_network

  redis:
    image: redis:7
    container_name: mobirex_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - mobirex_network

  web:
    build: .
    container_name: mobirex_web
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    volumes:
      # MUHIM: STATIC_ROOT prod settings'da /app/staticfiles
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    env_file:
      - .env.dev
    depends_on:
      - db
      - redis
    networks:
      - mobirex_network

  celery_worker:
    build: .
    container_name: mobirex_celery_worker
    restart: always
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - media_volume:/app/media
    env_file:
      - .env.dev
    depends_on:
      - db
      - redis
      - web
    networks:
      - mobirex_network

  celery_beat:
    build: .
    container_name: mobirex_celery_beat
    restart: always
    command: celery -A config beat -l info
    env_file:
      - .env.dev
    depends_on:
      - db
      - redis
      - web
      - celery_worker
    networks:
      - mobirex_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
    external: true
    name: mobirex_static_files
  media_volume:
    external: true
    name: mobirex_media_files

networks:
  mobirex_network:
    external: true
    name: mobirex_network
