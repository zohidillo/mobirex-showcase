{% if messages %}
<div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-full max-w-md px-3">
    <div class="space-y-2">
        {% for message in messages %}
            <div x-data="{ show: true }" x-init="setTimeout(() => show = false, 2000)" x-show="show" x-transition x-cloak>
                <div class="bg-gray-900 border border-gray-800 rounded-xl shadow-xl px-4 py-3 text-sm min-h-[44px] flex items-center border-l-4 {% if 'success' in message.tags %}border-l-green-500{% elif 'error' in message.tags %}border-l-red-500{% else %}border-l-blue-500{% endif %} text-gray-100">
                    {{ message }}
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endif %}
