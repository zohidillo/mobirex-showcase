{% load i18n %}

<div id="payment-history-modal" class="fixed inset-0 z-50 hidden" aria-hidden="true">
    <div class="absolute inset-0 bg-black/70" data-payments-modal-close></div>
    <div class="relative flex min-h-full items-center justify-center p-4">
        <div class="w-full max-w-2xl rounded-xl border border-gray-800 bg-gray-900 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-800 px-4 py-3">
                <div>
                    <h2 class="text-lg font-semibold text-gray-100">{% trans "To‘lovlar tarixi" %}</h2>
                    <p id="payment-history-modal-title" class="text-sm text-gray-400"></p>
                </div>
                <button
                    type="button"
                    class="rounded-lg bg-gray-800 px-3 py-2 text-sm text-gray-200 transition hover:bg-gray-700"
                    data-payments-modal-close
                >
                    {% trans "Yopish" %}
                </button>
            </div>
            <div id="payment-history-modal-body" class="max-h-[70vh] overflow-y-auto p-4"></div>
        </div>
    </div>
</div>

<script>
    (function() {
        const modal = document.getElementById('payment-history-modal');
        const title = document.getElementById('payment-history-modal-title');
        const body = document.getElementById('payment-history-modal-body');

        if (!modal || !title || !body) {
            return;
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.setAttribute('aria-hidden', 'true');
            body.innerHTML = '';
            title.textContent = '';
            document.body.classList.remove('overflow-hidden');
        }

        document.addEventListener('click', function(event) {
            const trigger = event.target.closest('[data-payments-modal-trigger]');
            if (trigger) {
                const templateId = trigger.getAttribute('data-template-id');
                const template = templateId ? document.getElementById(templateId) : null;
                if (!template) {
                    return;
                }

                title.textContent = trigger.getAttribute('data-debt-title') || '';
                body.innerHTML = template.innerHTML;
                modal.classList.remove('hidden');
                modal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('overflow-hidden');
                return;
            }

            if (event.target.closest('[data-payments-modal-close]')) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
                closeModal();
            }
        });
    })();
</script>
