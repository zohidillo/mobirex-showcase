# /etc/nginx/sites-available/mobirex
# Mobirex production nginx config
# Parallel with crm.conf (legacy crm.b26.uz domain).
# Deploy: copy to /etc/nginx/sites-available/, symlink to sites-enabled/,
#         then: nginx -t && systemctl reload nginx

# ===== Landing site redirect (HTTP → HTTPS) =====
server {
    listen 80;
    listen [::]:80;
    server_name mobirex.uz www.mobirex.uz;
    return 301 https://mobirex.uz$request_uri;
}

# ===== Landing site (static) =====
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mobirex.uz www.mobirex.uz;

    ssl_certificate     /etc/letsencrypt/live/mobirex.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobirex.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/mobirex-landing;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1000;
}

# ===== API backend redirect (HTTP → HTTPS) =====
server {
    listen 80;
    listen [::]:80;
    server_name api.mobirex.uz;
    return 301 https://api.mobirex.uz$request_uri;
}

# ===== API backend (api.mobirex.uz) =====
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mobirex.uz;

    ssl_certificate     /etc/letsencrypt/live/api.mobirex.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mobirex.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
