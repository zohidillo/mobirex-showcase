server {
    listen 80;
    server_name edudocs.mobirex.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name edudocs.mobirex.uz;

    ssl_certificate     /etc/letsencrypt/live/edudocs.mobirex.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edudocs.mobirex.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 15M;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # Telegram webhook → bot container
    location /tg/ {
        rewrite ^/tg/(.*)$ /$1 break;
        proxy_pass http://edudocai_bot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Asosiy API + admin paneli → api container
    location / {
        proxy_pass http://edudocai_api:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}