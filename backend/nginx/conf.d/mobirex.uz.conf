# Landing site: mobirex.uz, www.mobirex.uz
# Static fayllar ../landing dan mount qilingan (/var/www/mobirex-landing)

# HTTP -> HTTPS redirect (ACME challenge bundan mustasno)
server {
    listen 80;
    listen [::]:80;
    server_name mobirex.uz www.mobirex.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mobirex.uz$request_uri;
    }
}

# www -> apex redirect (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mobirex.uz;

    ssl_certificate     /etc/letsencrypt/live/mobirex.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobirex.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://mobirex.uz$request_uri;
}

# Asosiy landing (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mobirex.uz;

    ssl_certificate     /etc/letsencrypt/live/mobirex.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobirex.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/mobirex-landing;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1000;
}
