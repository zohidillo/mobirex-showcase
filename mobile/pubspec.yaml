name: mobile
description: "Mobirex - Business management mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  url_launcher: ^6.3.0
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2
  connectivity_plus: ^6.1.0
  crypto: ^3.0.3
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "mobirex_logo.png"
  adaptive_icon_background: "#13212A"
  adaptive_icon_foreground: "mobirex_logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/mobirex_logo.png
